[tool.coverage.run]
branch = true
source = [ "api" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report html:'../../coverage/apps/api/html' --cov-report xml:'../../coverage/apps/api/coverage.xml' --html='../../reports/apps/api/unittests/html/index.html' --junitxml='../../reports/apps/api/unittests/junit.xml'"

[tool.poetry]
name = "api"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = 'Proprietary'
readme = 'README.md'

  [[tool.poetry.packages]]
  include = "api"

  [tool.poetry.dependencies]
  python = ">=3.9,<3.11"
  fastapi = "^0.115.11"
  tortoise-orm = "^0.24.2"
  pymysql = "^1.1.1"
  uvicorn = "^0.34.0"
  python-dotenv = "^1.0.1"
  aerich = "^0.8.2"
  asyncmy = "^0.2.10"
  aiomysql = "^0.2.0"
  pydantic = {extras = ["email"], version = "^2.10.6"}
  passlib = "^1.7.4"
  bcrypt = "^4.3.0"
  babel = "^2.17.0"
  websockets = "^15.0.1"

  [tool.poetry.group.dev.dependencies]
  autopep8 = "2.0.2"
  flake8 = "6.0.0"
  pytest = "7.3.1"
  pytest-sugar = "0.9.7"
  pytest-cov = "4.1.0"
  pytest-html = "3.2.0"

  [tool.aerich]
  tortoise_orm = "api.database.TORTOISE_ORM"
  location = "./migrations"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
